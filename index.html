<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Got Fiber</title>
<meta name="description" content="Check whether fiber internet is reported at a US address and see broadband contracts and bids within 50 miles.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F0B400' stroke='%2317212B' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <aside class="panel">
    <header>
      <div class="top">
        <h1>Got Fiber?</h1>
        <button id="theme" class="theme" type="button" aria-pressed="false">Dark mode</button>
      </div>
      <p class="lede">Enter a home address to see if fiber internet is reported there, who offers it, and which broadband contracts and bids are within 50 miles.</p>
    </header>
    <form id="search" class="search">
      <label for="address" class="sr-only">Home address</label>
      <input id="address" name="address" type="text" placeholder="123 Main St, Kingman, AZ" autocomplete="street-address" required>
      <button id="go" type="submit">Check address</button>
    </form>
    <div id="result" class="result" aria-live="polite"></div>
    <footer id="meta" class="meta"></footer>
  </aside>
  <div id="map" class="map" role="region" aria-label="Map of fiber coverage near the address"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<script src="js/app.js"></script>
</body>
</html>
